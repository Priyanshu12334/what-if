<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1b2430" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#121820" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#f2a93b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f2a93b" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ece8df" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0b0f14" />
  <rect width="800" height="600" fill="url(#glow)" />
  <rect width="800" height="600" fill="url(#amberGlow)" />
  <rect width="800" height="600" fill="url(#grid)" />

  <!-- Subtle Borders -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#ece8df" stroke-opacity="0.1" stroke-width="1" />
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#f2a93b" stroke-opacity="0.15" stroke-width="1" />

  <!-- Center Decorative Mark -->
  <circle cx="400" cy="270" r="90" fill="none" stroke="#ece8df" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 6" />
  <circle cx="400" cy="270" r="60" fill="none" stroke="#f2a93b" stroke-opacity="0.25" stroke-width="1" />
  <circle cx="400" cy="270" r="4" fill="#f2a93b" opacity="0.8" />

  <!-- Central Watermark Typography -->
  <text x="400" y="295" font-family="'Fraunces', 'Times New Roman', serif" font-size="96" font-weight="700" fill="#ece8df" fill-opacity="0.12" text-anchor="middle">?</text>
  <text x="400" y="420" font-family="'Fraunces', 'Times New Roman', serif" font-size="28" font-weight="600" letter-spacing="4" fill="#ece8df" fill-opacity="0.75" text-anchor="middle">WHAT IF?</text>
  <text x="400" y="450" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="6" fill="#f2a93b" fill-opacity="0.8" text-anchor="middle">UNIVERSE ARCHIVE</text>
</svg>
